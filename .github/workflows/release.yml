name: Release

on:
  push:
    tags:
      - "v*" # triggers only if push new tag version, like `v0.8.4` or else

permissions:
  security-events: write
  packages: write
  contents: write
  actions: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false # set to true and configure cache-dependency-path if go.sum is in a subdir

      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # https://github.com/orgs/community/discussions/26686
      - name: Branch name
        id: branch_name
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_VAL="${GITHUB_REF#refs/tags/}"
          else
            TAG_VAL="${GITHUB_REF#refs/heads/}"
          fi
          echo "SOURCE_NAME=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"
          echo "SOURCE_BRANCH=${GITHUB_REF#refs/heads/}" >> "$GITHUB_OUTPUT"
          echo "SOURCE_TAG=${TAG_VAL}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GOPATH: /home/runner/go
        run: |
          # use make build_all to generate srv executables for all platforms
          make build_all
          tar cvfz frontend.tar.gz srv*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for local scan
        run: |
          make golib
          make
          make changes
          # use multi-stage build to run on mac ARM:
          # https://stackoverflow.com/questions/71000707/docker-get-started-warning-the-requested-images-platform-linux-arm64-v8-doe
          # https://github.com/docker/for-mac/issues/6356
          # https://docs.docker.com/build/ci/github-actions/multi-platform/
          docker buildx build --platform linux/amd64 --load \
            -t "ghcr.io/chesscomputing/frontend:${{ steps.branch_name.outputs.SOURCE_TAG }}" \
            --label "org.opencontainers.image.description=FOXDEN frontend service" \
            --label "org.opencontainers.image.source=https://github.com/chesscomputing/frontend" \
            --label "org.opencontainers.image.licenses=MIT" \
            .

      - name: Scan image with Trivy (vulnerability report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "ghcr.io/chesscomputing/frontend:${{ steps.branch_name.outputs.SOURCE_TAG }}"
          format: "table"
          output: "trivy-report.txt"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Generate SARIF report for GitHub Security tab
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "ghcr.io/chesscomputing/frontend:${{ steps.branch_name.outputs.SOURCE_TAG }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-container-image"

      - name: Upload vulnerability report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-vulnerability-report
          if-no-files-found: ignore
          path: |
            trivy-report.txt
            trivy-results.sarif
          retention-days: 30

      - name: Login to ghcr.io registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/chesscomputing/frontend:latest
            ghcr.io/chesscomputing/frontend:${{ steps.branch_name.outputs.SOURCE_TAG }}

      - name: Create Release and Upload Binaries
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.branch_name.outputs.SOURCE_TAG }}
          name: Release ${{ steps.branch_name.outputs.SOURCE_TAG }}
          body_path: "LAST_CHANGES.md"
          draft: false
          prerelease: false
          files: ./frontend.tar.gz
